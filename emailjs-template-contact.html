<!--
  FeelVoyage — șablon EmailJS pentru notificarea de comandă nouă (folosit atât pentru „Trimite Cerere de
  Ofertă”, cât și pentru rezervările de pachete).

  IMPORTANT, citește înainte de a pune ceva aici:
  1. EmailJS NU suportă sintaxa Handlebars {{#if}} — e doar înlocuire simplă de variabile (confirmat în
     documentația lor oficială). Un {{#if}} în template produce exact eroarea „Template: One or more
     dynamic variables are corrupted”. De-asta TOT ce diferă de la o cerere la alta (telefon, e-mail,
     destinație, țară, mesaj, perioadă, călători, servicii) e deja construit ca HTML gata făcut, în
     js/emailnotify.js, și ajunge aici într-UN SINGUR bloc: {{{body_html}}}. NU desface acel bloc în bucăți
     și NU schimba triplele acolade {{{ }}} în duble {{ }} — ar apărea codul HTML ca text simplu, nu randat.
  2. Dacă primești din nou eroarea „corrupted” DUPĂ ce pui acest template: verifică și restul câmpurilor
     din EmailJS (nu doar conținutul de mai jos) — în special „To Email” (ar trebui să fie {{to_email}})
     și „Subject”. O variabilă greșită ACOLO poate da aceeași eroare, nu doar conținutul.

  CUM ÎL PUI ÎN EMAILJS:
  1. emailjs.com → Email Templates → template-ul tău (cel din templateId din js/emailjs-config.js).
  2. Butonul „</> Code Editor” (colțul din dreapta sus) — NU „Design Editor”.
  3. Șterge tot, lipește tot conținutul acestui fișier.
  4. „To Email”: {{to_email}}
  5. „Subject”: {{order_type}} — {{name}}
  6. „Save”.
-->
<div style="margin:0; padding:24px 12px; background:#f1f5f9; font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e2e8f0;">

    <!-- Antet -->
    <tr>
      <td style="background:#0f172a; padding:22px 28px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="font-family:Georgia,'Times New Roman',serif; font-size:20px; font-weight:bold; color:#ffffff;">
              Feel<span style="color:#f59e0b;">Voyage</span>
            </td>
            <td align="right" style="font-size:11px; font-weight:bold; letter-spacing:.04em; text-transform:uppercase; color:#94a3b8;">
              {{order_type}}
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Titlu -->
    <tr>
      <td style="padding:24px 28px 4px;">
        <p style="margin:0; font-size:12px; font-weight:bold; letter-spacing:.04em; text-transform:uppercase; color:#0284c7;">Cerere nouă primită</p>
        <h1 style="margin:4px 0 0; font-size:22px; color:#0f172a; font-family:Georgia,'Times New Roman',serif;">{{name}}</h1>
        <p style="margin:4px 0 0; font-size:13px; color:#94a3b8;">{{sent_at}}</p>
      </td>
    </tr>

    <!-- Tot conținutul variabil (contact, destinație, țară, mesaj, perioadă, călători, servicii) — un singur
         bloc, gata construit în js/emailnotify.js, niciodată despărțit în bucăți mai mici aici. -->
    <tr>
      <td style="padding:18px 28px 6px;">
        {{{body_html}}}
      </td>
    </tr>

    <!-- Butoane de răspuns rapid -->
    <tr>
      <td align="center" style="padding:14px 28px 26px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
          <tr>
            <td style="border-radius:10px; background:#16a34a; text-align:center;">
              <a href="tel:{{phone}}" style="display:inline-block; padding:12px 20px; font-size:14px; font-weight:bold; color:#ffffff; text-decoration:none;">📞 Sună pe {{name}}</a>
            </td>
            <td width="16" style="width:16px;"></td>
            <td style="border-radius:10px; background:#0284c7; text-align:center;">
              <a href="mailto:{{email}}" style="display:inline-block; padding:12px 20px; font-size:14px; font-weight:bold; color:#ffffff; text-decoration:none;">✉️ Răspunde pe e-mail</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Subsol -->
    <tr>
      <td style="padding:16px 28px; background:#f8fafc; border-top:1px solid #e2e8f0;">
        <p style="margin:0; font-size:11px; color:#94a3b8; text-align:center;">Notificare automată FeelVoyage — cererea e deja salvată și în Jurnalul de pe site.</p>
      </td>
    </tr>

  </table>
</div>
