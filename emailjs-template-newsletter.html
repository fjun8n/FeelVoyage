<!--
  FeelVoyage — șablon EmailJS pentru anunțuri/newsletter (butonul de megafon din panoul de admin).
  Diferit de emailjs-template-contact.html — ăsta e pentru updateTemplateId (newsletter), nu pentru
  templateId (notificări de comandă). Variabilele trimise sunt DOAR {{message}} și {{sent_at}} — abonații
  nu au nume salvat, așa că nu poți personaliza cu „Salut, Ion”.

  REGULI DE AUR (aceleași ca la emailjs-template-contact.html — altfel apare eroarea „Template: One or
  more dynamic variables are corrupted”):
  1. NICIODATĂ ghilimele simple ' în interiorul unui atribut style="..." (ex: 'Times New Roman').
  2. NICIODATĂ tabel-în-tabel-în-tabel (maximum UN nivel de <table>).

  CUM ÎL PUI ÎN EMAILJS:
  1. emailjs.com → Email Templates → template-ul folosit pentru newsletter (updateTemplateId din
     js/emailjs-config.js).
  2. Butonul „</> Code Editor” (colțul din dreapta sus) — NU „Design Editor”.
  3. Șterge tot, lipește conținutul acestui fișier.
  4. „Subject”, pune ceva de genul: Noutăți de la FeelVoyage
  5. „Save”.
-->
<div style="max-width:560px; margin:0 auto; font-family:Arial,sans-serif; background:#f1f5f9; padding:20px 12px;">

  <!-- Antet — banner plin, iconița site-ului în stânga + text FeelVoyage -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a; border-radius:14px 14px 0 0;">
    <tr>
      <td style="padding:16px 22px;">
        <img src="https://fjun8n.github.io/FeelVoyage/img/logo-icon-email.png" width="40" height="40" alt="" style="display:inline-block; width:40px; height:40px; vertical-align:middle; margin-right:10px;">
        <span style="vertical-align:middle; font-size:22px; font-family:Georgia,serif;"><span style="color:#f59e0b;">Feel</span><span style="color:#ffffff; font-weight:bold;">Voyage</span></span>
      </td>
    </tr>
  </table>

  <!-- Etichetă „Anunț” -->
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:14px 0 0;">
    <tr><td style="background:#fde68a; color:#78350f; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:0.5px; padding:6px 14px; border-radius:999px;">Anunț FeelVoyage</td></tr>
  </table>

  <!-- Mesajul -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:14px; margin:10px 0 0; box-shadow:0 1px 2px rgba(0,0,0,0.04);">
    <tr><td style="padding:22px 24px; font-size:16px; line-height:1.7; color:#0f172a; font-weight:600;">{{message}}</td></tr>
  </table>

  <!-- Buton -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:18px 0 0;">
    <tr>
      <td style="text-align:center;">
        <a href="https://fjun8n.github.io/FeelVoyage/" style="display:inline-block; padding:14px 32px; background:#0284c7; color:#ffffff; font-weight:bold; font-size:15px; text-decoration:none; border-radius:999px;">Vizitează Site-ul</a>
      </td>
    </tr>
  </table>

  <!-- Subsol -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:18px 0 0;">
    <tr>
      <td style="padding:14px 22px; font-size:12px; color:#94a3b8; text-align:center; line-height:1.7;">
        Primești acest e-mail pentru că ești abonat la newsletter-ul FeelVoyage.<br>
        Dacă nu mai vrei să primești aceste anunțuri, <a href="mailto:crucrudenis@gmail.com?subject=Dezabonare%20newsletter" style="color:#94a3b8; text-decoration:underline;">scrie-ne aici</a> și te dezabonăm imediat.
      </td>
    </tr>
  </table>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td style="padding:0 22px; font-size:11px; font-weight:bold; color:#64748b; text-align:center;">{{sent_at}}</td></tr>
  </table>

</div>
